[package]
name = "hl-v2"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Daemon-first command-line trading client for Hyperliquid"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/bahmgit/hlcli"
publish = false

[lib]
name = "hl_v2"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
alloy-dyn-abi = "1.5.6"
alloy-primitives = { version = "1.5.7", features = ["getrandom"] }
alloy-signer = { version = "2.0.4", features = ["eip712"] }
alloy-signer-local = { version = "2.0.4", features = ["eip712"] }
alloy-sol-types = { version = "1.5.6", features = ["eip712-serde", "json"] }
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.7", features = ["json"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmp-serde = "1"
rust_decimal = { version = "1.39", features = ["serde", "serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
zeroize = { version = "1", features = ["derive"] }

[[bin]]
name = "hld"
path = "src/bin/hld.rs"

[[bin]]
name = "hl"
path = "src/bin/hl.rs"

[dev-dependencies]
libc = "0.2"
tower = "0.5"
